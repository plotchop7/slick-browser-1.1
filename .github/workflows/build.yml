name: Unpack and Build Slick APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Slick_Browser_1.zip
        run: |
          if [ -f "Slick_Browser_1.zip" ]; then
            unzip -q -o Slick_Browser_1.zip
            rm -f Slick_Browser_1.zip
            if [ -d "Slick" ]; then
              cp -rf Slick/* . 2>/dev/null || true
              cp -rf Slick/.* . 2>/dev/null || true
              rm -rf Slick
            fi
            chmod +x gradlew
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Unpack Slick project" || true
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Slick-Browser-APK
          path: app/build/outputs/apk/debug/*.apk
